name: AIPE Magnetics Design
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

# Every AIPE dependency is pinned to a tagged release, so a run is reproducible.
env:
  DATABASE_REQUIREMENT: "aipe-magnetics-database @ git+https://github.com/AIPE-Labs/AIPE-Magnetics-Database.git@v0.3.0"
  DATABASE_REF: v0.3.0
  CORE_REF: v0.1.0
  REGISTRY_REF: v0.1.0

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install AIPE-Magnetics-Database (tagged release)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.DATABASE_REQUIREMENT }}"
      - name: Install package with development extras
        run: python -m pip install -e ".[dev]"
      - name: Unit, model, design, API, MCP, plugin and integration tests
        run: python -m pytest -q
      - name: Verification suite (evidence must match the bundled file)
        run: python -m aipe_magnetics_design.cli.main verify --output reports/verification --check-bundled
      - name: DAB 10 kW transformer demonstration (offline)
        if: always()
        run: python -m aipe_magnetics_design.cli.main demo dab-10kw --output reports/demo
      - name: Database -> Design example
        run: python examples/database_to_design.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/

  ecosystem:
    name: released AIPE-Core / AIPE-Registry validators accept this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: AIPE-Labs/AIPE-Core, ref: '${{ env.CORE_REF }}', path: ecosystem/AIPE-Core}
      - uses: actions/checkout@v4
        with: {repository: AIPE-Labs/AIPE-Registry, ref: '${{ env.REGISTRY_REF }}', path: ecosystem/AIPE-Registry}
      - uses: actions/checkout@v4
        with: {repository: AIPE-Labs/AIPE-Magnetics-Database, ref: '${{ env.DATABASE_REF }}', path: ecosystem/AIPE-Magnetics-Database}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "${{ env.DATABASE_REQUIREMENT }}"
      - run: python -m pip install -e ".[dev]"
      - name: External tests against the released validators and schemas (must run, not skip)
        run: |
          python -m pytest -q -m external tests/integrations -rs | tee external.log
          ! grep -q "AIPE_ECOSYSTEM_CHECKOUTS not set" external.log
        env:
          AIPE_ECOSYSTEM_CHECKOUTS: ${{ github.workspace }}/ecosystem

  plugins:
    name: plugin packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "${{ env.DATABASE_REQUIREMENT }}"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/plugins
